<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color Changing Cube</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at center, #0a0a0a, #000);
  }
  canvas { display: block; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// Cube settings
const size = 123;
const divisions = 3;

let points = [];
let triangles = [];

// Create subdivided cube
function createFace(axis, sign) {
  for (let i = 0; i < divisions; i++) {
    for (let j = 0; j < divisions; j++) {

      let a = -1 + (i / divisions) * 2;
      let b = -1 + (j / divisions) * 2;
      let c = -1 + ((i + 1) / divisions) * 2;
      let d = -1 + ((j + 1) / divisions) * 2;

      let facePoints = [];

      if (axis === "z") {
        facePoints = [[a,b,sign],[c,b,sign],[c,d,sign],[a,d,sign]];
      }
      if (axis === "x") {
        facePoints = [[sign,a,b],[sign,c,b],[sign,c,d],[sign,a,d]];
      }
      if (axis === "y") {
        facePoints = [[a,sign,b],[c,sign,b],[c,sign,d],[a,sign,d]];
      }

      const idx = points.length;
      facePoints.forEach(p => points.push(p.map(v => v * size)));

      triangles.push([idx, idx+1, idx+2]);
      triangles.push([idx, idx+2, idx+3]);
    }
  }
}

// Build cube
createFace("z", 1);
createFace("z", -1);
createFace("x", 1);
createFace("x", -1);
createFace("y", 1);
createFace("y", -1);

// Rotation
let angleX = 0;
let angleY = 0;

// Fast rotation
let autoSpeedX = 0.04;
let autoSpeedY = 0.05;

// Color animation
let hue = 0;

function rotate([x, y, z]) {
  let cosX = Math.cos(angleX);
  let sinX = Math.sin(angleX);
  let y1 = y * cosX - z * sinX;
  let z1 = y * sinX + z * cosX;

  let cosY = Math.cos(angleY);
  let sinY = Math.sin(angleY);
  let x1 = x * cosY + z1 * sinY;
  let z2 = -x * sinY + z1 * cosY;

  return [x1, y1, z2];
}

function project([x, y, z]) {
  const distance = 400;
  const scale = distance / (distance - z);
  return [
    x * scale + canvas.width / 2,
    y * scale + canvas.height / 2
  ];
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  angleX += autoSpeedX;
  angleY += autoSpeedY;

  hue += 1; // color speed

  const rotated = points.map(p => rotate(p));

  triangles.forEach(tri => {
    const p0 = project(rotated[tri[0]]);
    const p1 = project(rotated[tri[1]]);
    const p2 = project(rotated[tri[2]]);

    ctx.shadowBlur = 0; // no glow

    ctx.strokeStyle = `hsl(${hue}, 100%, 70%)`;
    ctx.lineWidth = 1.2;

    ctx.beginPath();
    ctx.moveTo(...p0);
    ctx.lineTo(...p1);
    ctx.lineTo(...p2);
    ctx.closePath();
    ctx.stroke();
  });

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
